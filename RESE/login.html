<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in or create an account — EventSync Real-Time Event Synchronization Engine." />
  <title>EventSync — Login / Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card" id="authCard">

      <!-- ─── Login Form ──────────────────────── -->
      <div id="loginView">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your EventSync account</p>

        <div class="auth-error" id="loginError"></div>

        <form id="loginForm" autocomplete="on">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn--primary btn--block" id="loginBtn">Sign In</button>
        </form>

        <p class="auth-toggle">
          Don't have an account? <a href="#register" id="showRegister">Create one</a>
        </p>
      </div>

      <!-- ─── Register Form ───────────────────── -->
      <div id="registerView" style="display:none;">
        <h1>Create Account</h1>
        <p class="subtitle">Join EventSync and start managing events</p>

        <div class="auth-error" id="registerError"></div>

        <form id="registerForm" autocomplete="on">
          <div class="form-group">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" class="form-control" placeholder="johndoe" minlength="3" required />
          </div>
          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Min. 6 characters" minlength="6" required />
          </div>
          <button type="submit" class="btn btn--primary btn--block" id="regBtn">Create Account</button>
        </form>

        <p class="auth-toggle">
          Already have an account? <a href="#login" id="showLogin">Sign in</a>
        </p>
      </div>

    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
