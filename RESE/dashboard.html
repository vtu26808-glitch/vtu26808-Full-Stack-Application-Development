<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EventSync Dashboard — View, create and manage real-time events." />
  <title>EventSync — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ─── Navbar ─────────────────────────────────────── -->
  <nav class="navbar">
    <div class="container">
      <a href="dashboard.html" class="navbar__logo">⚡ EventSync</a>
      <div class="navbar__links" id="navLinks">
        <span style="font-size:.82rem;color:var(--clr-text-muted)"><span class="live-dot"></span>Live</span>

        <!-- Notifications bell -->
        <div class="bell-wrap" id="bellWrap">
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 002 2zm6-6V11c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 00-3 0v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          <span class="bell-badge" id="bellBadge" style="display:none;">0</span>

          <div class="notif-dropdown" id="notifDropdown">
            <div class="notif-dropdown__header">
              <span>Notifications</span>
              <button id="markAllRead">Mark all read</button>
            </div>
            <div id="notifList"></div>
          </div>
        </div>

        <!-- Avatar -->
        <div class="avatar-chip" id="userChip">
          <div class="avatar-chip__circle" id="userAvatar">?</div>
          <span id="userName">User</span>
        </div>

        <a href="#" id="logoutBtn" style="font-size:.82rem;color:var(--clr-accent);">Log Out</a>
      </div>
    </div>
  </nav>

  <!-- ─── Toast Container ────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ─── Dashboard Content ──────────────────────────── -->
  <main class="dash">
    <div class="container">

      <div class="dash__header">
        <h1>📋 Event Dashboard</h1>
        <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;">
          <div class="filters" id="statusFilters">
            <button class="filter-btn active" data-status="">All</button>
            <button class="filter-btn" data-status="upcoming">Upcoming</button>
            <button class="filter-btn" data-status="ongoing">Ongoing</button>
            <button class="filter-btn" data-status="completed">Completed</button>
            <button class="filter-btn" data-status="cancelled">Cancelled</button>
          </div>
          <button class="btn btn--primary btn--sm" id="openCreateModal">+ New Event</button>
        </div>
      </div>

      <!-- Event list -->
      <div id="eventsArea">
        <div class="spinner"></div>
      </div>

    </div>
  </main>

  <!-- ─── Create Event Modal ─────────────────────────── -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <div class="modal__header">
        <h2>Create New Event</h2>
        <button class="modal__close" id="closeCreateModal">&times;</button>
      </div>
      <form id="createEventForm">
        <div class="form-group">
          <label for="evTitle">Event Title *</label>
          <input type="text" id="evTitle" class="form-control" placeholder="Sprint Planning Meeting" required />
        </div>
        <div class="form-group">
          <label for="evDesc">Description</label>
          <textarea id="evDesc" class="form-control" placeholder="Brief description of the event..."></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem;">
          <div class="form-group">
            <label for="evCategory">Category</label>
            <select id="evCategory" class="form-control">
              <option value="meeting">Meeting 👥</option>
              <option value="workshop">Workshop 📝</option>
              <option value="Sports">Sports 🏆</option>
              <option value="Training">Training 🖥️</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="evDate">Date &amp; Time *</label>
            <input type="datetime-local" id="evDate" class="form-control" required />
          </div>
        </div>
        <div class="form-group">
          <label for="evLocation">Location</label>
          <input type="text" id="evLocation" class="form-control" placeholder="Room 301 / Zoom link" />
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="createBtn">Create Event</button>
      </form>
    </div>
  </div>

  <!-- ─── Update Event Modal ─────────────────────────── -->
  <div class="modal-overlay" id="updateModal">
    <div class="modal">
      <div class="modal__header">
        <h2>Update Event Status</h2>
        <button class="modal__close" id="closeUpdateModal">&times;</button>
      </div>
      <form id="updateEventForm">
        <input type="hidden" id="upEventId" />
        <p style="margin-bottom:.8rem;font-size:.9rem;color:var(--clr-text-muted);">
          Updating: <strong id="upEventTitle" style="color:var(--clr-text-heading);"></strong>
        </p>
        <div class="form-group">
          <label for="upStatus">New Status</label>
          <select id="upStatus" class="form-control">
            <option value="upcoming">Upcoming</option>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="form-group">
          <label for="upMessage">Note (optional)</label>
          <input type="text" id="upMessage" class="form-control" placeholder="Reason for the update..." />
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="updateBtn">Update Status</button>
      </form>
    </div>
  </div>

  <!-- ─── Footer ─────────────────────────────────────── -->
  <footer class="footer container">
    <p>&copy; 2026 EventSync — Real-Time Event Synchronization Engine</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
